<html class="light" lang="en"><head>

              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",

              "spacing": {

              "fontFamily": {

<style>
          .material-symbols-outlined {
              font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
          }
          [data-weight="fill"] .material-symbols-outlined {
              font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
          }
          /* Custom scrollbar for text area */
          textarea::-webkit-scrollbar {
            width: 4px;
          }
          textarea::-webkit-scrollbar-track {
            background: transparent;
          }
          textarea::-webkit-scrollbar-thumb {
            background-color: #E8DAD0;
            border-radius: 20px;
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen relative font-body text-body text-on-surface antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Dimmed Background Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-on-background/40 z-40 backdrop-blur-sm transition-opacity duration-300"></div>
<!-- Main Content Canvas (Simulating the screen beneath the modal) -->
<div class="w-full h-full absolute inset-0 pt-safe-top px-edge-margin bg-background">
<!-- Background content mockup -->
<div class="flex items-center justify-between mb-8 opacity-30">
<div class="font-display text-display text-primary">Credentia</div>
<div class="w-10 h-10 rounded-full bg-surface-alt flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">person</span>
</div>
</div>
<div class="space-y-4 opacity-30">
<div class="h-32 bg-surface rounded-[20px] w-full"></div>
<div class="h-48 bg-surface rounded-[20px] w-full"></div>
</div>
</div>
<!-- Bottom Sheet Modal -->
<div class="fixed inset-x-0 bottom-0 z-50 bg-surface rounded-t-[20px] shadow-[0_-8px_24px_rgba(0,0,0,0.06)] transform transition-transform duration-300 ease-out flex flex-col max-h-[795px]">
<!-- Drag Handle / Visual Indicator -->
<div class="w-full flex justify-center pt-3 pb-1 shrink-0">
<div class="w-12 h-1.5 rounded-full bg-border"></div>
</div>
<!-- Top Header Area -->
<div class="flex justify-between items-center px-edge-margin py-3 shrink-0">
<button aria-label="Close modal" class="p-2 -ml-2 text-on-surface hover:bg-surface-alt rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-display text-title text-on-surface m-0 text-center flex-1">New Post</h1>
<button class="bg-primary-container text-on-primary font-label text-label py-[8px] px-4 rounded-full hover:bg-accent-pressed active:bg-accent-pressed transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" type="button">
                Post
            </button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto flex flex-col px-edge-margin pb-safe-bottom">
<!-- User Info Row (Optional contextual element for high-end feel) -->
<div class="flex items-center gap-3 py-4">
<img class="w-10 h-10 rounded-full object-cover shadow-sm bg-surface-alt" data-alt="A small circular avatar of a professional healthcare worker, smiling warmly in a modern clinical setting with soft natural light, conveying trust and competence in a modern high-key aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhuWifzAUZM7HH8zxoqyxMVsfTz39XwvhOC9hvuiWMknE38xSfKuYMX5RIvguOY8AzHzFBHjvlT2I5P1l6xZfwSqWXNUEPu7Mxi6ASQClTQf_BUZ7W7zmXDwBbrNSxHYskB7LDYRPsq8r_fWYPUPcZuRCVXEgXjg49BhXzYyl2wKl7dN1PI1KCLnZq0ltGNV_BQEFxwYIDN9RoMtPMq5Ca4031YvbVCtKADvUeruDc4sg7EfXmJqy_"/>
<div>
<div class="font-title text-label text-on-surface">Dr. Sarah Jenkins</div>
<div class="font-caption text-caption text-text-tertiary">Sharing to network</div>
</div>
</div>
<!-- Main Text Area -->
<div class="flex-1 min-h-[150px] py-2 relative">
<textarea aria-label="Post content" class="w-full h-full bg-transparent border-none resize-none focus:ring-0 p-0 font-body text-body text-on-surface placeholder-text-tertiary" placeholder="Share an update with your network..."></textarea>
</div>
<!-- Visibility Section -->
<div class="py-4 border-t border-border/50">
<p class="font-label text-label text-text-secondary mb-3">Who can see this?</p>
<div class="flex flex-wrap gap-2">
<!-- Active Chip -->
<button class="px-4 py-2 rounded-full bg-accent-tint text-primary-container font-label text-label border border-transparent transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
                        Public
                    </button>
<!-- Inactive Chips -->
<button class="px-4 py-2 rounded-full bg-surface-alt text-text-secondary font-label text-label border border-transparent hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-outline" type="button">
                        Connections only
                    </button>
<button class="px-4 py-2 rounded-full bg-surface-alt text-text-secondary font-label text-label border border-transparent hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-outline" type="button">
                        Private
                    </button>
</div>
</div>
<!-- Attachment Row -->
<div class="py-4 flex items-center gap-4">
<button aria-label="Add Photo" class="flex items-center gap-2 text-primary hover:text-primary-container transition-colors p-2 -ml-2 rounded-lg hover:bg-surface-alt focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined" data-icon="photo_camera" data-weight="fill">photo_camera</span>
<span class="font-label text-label hidden sm:inline">Photo</span>
</button>
<button aria-label="Add Document" class="flex items-center gap-2 text-primary hover:text-primary-container transition-colors p-2 rounded-lg hover:bg-surface-alt focus:outline-none focus:ring-2 focus:ring-primary-container" type="button">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
<span class="font-label text-label hidden sm:inline">Document</span>
</button>
</div>
</div>
</div>
</body></html>
