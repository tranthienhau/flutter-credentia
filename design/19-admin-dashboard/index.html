<body class="bg-background text-on-background font-body min-h-screen antialiased flex flex-col max-w-[600px] mx-auto overflow-x-hidden relative">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-edge-margin pt-safe-top h-[94px] w-full bg-background sticky top-0 z-40">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-alt transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chevron_left</span>
</button>
<h1 class="font-display text-title text-primary">Admin</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 pb-safe-bottom">
<!-- Stat Cards Horizontal Scroll -->
<section class="mt-4 pl-edge-margin mb-8">
<div class="flex gap-4 overflow-x-auto no-scrollbar pr-edge-margin pb-4 -mb-4 snap-x">
<!-- Stat Card 1 -->
<div class="flex-shrink-0 w-40 bg-surface rounded-2xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.04)] snap-start">
<p class="font-caption text-caption text-text-tertiary mb-2 uppercase tracking-wide">Pending verifications</p>
<p class="font-display text-display text-primary">12</p>
</div>
<!-- Stat Card 2 -->
<div class="flex-shrink-0 w-40 bg-surface rounded-2xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.04)] snap-start">
<p class="font-caption text-caption text-text-tertiary mb-2 uppercase tracking-wide">Open reports</p>
<p class="font-display text-display text-on-surface">5</p>
</div>
<!-- Stat Card 3 -->
<div class="flex-shrink-0 w-40 bg-surface rounded-2xl p-4 shadow-[0_1px_2px_rgba(0,0,0,0.04)] snap-start">
<p class="font-caption text-caption text-text-tertiary mb-2 uppercase tracking-wide">Active users</p>
<p class="font-display text-display text-on-surface">1.2k</p>
</div>
</div>
</section>
<!-- Segmented Control Tabs -->
<section class="px-edge-margin mb-6">
<div class="bg-surface-alt p-1 rounded-full flex">
<button class="flex-1 py-2 px-4 rounded-full bg-surface shadow-[0_1px_2px_rgba(0,0,0,0.04)] font-label text-label text-primary transition-all">
                    Verification requests
                </button>
<button class="flex-1 py-2 px-4 rounded-full font-label text-label text-text-tertiary hover:text-on-surface transition-all">
                    Reported content
                </button>
</div>
</section>
<!-- Verification Requests List -->
<section class="px-edge-margin flex flex-col gap-4">
<!-- Card 1 -->
<article class="bg-surface rounded-2xl p-5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_24px_rgba(0,0,0,0.06)] transition-shadow">
<div class="flex gap-4 mb-4">
<div class="w-16 h-16 rounded-lg bg-surface-alt overflow-hidden flex-shrink-0 border border-border">
<img alt="Document thumbnail" class="w-full h-full object-cover" data-alt="A macro shot of a sleek, modern medical license ID card featuring a subtle watermark, resting on a clean white surface with soft, diffused studio lighting. The aesthetic is extremely professional, crisp, and high-key, using soft warm earth tones and stark whites to convey trust and precision in a high-end healthcare networking context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCscqahBLjoobhK7uee7ftPUyOA0-bCSk5lY4HgCewzQImjlnQHOpxkUSWaTru1kGI2LFy00N4l_27MBXBSMKkrYX25dWpJRSFPPaEqakEt4PGhf2Z9snPZtzjBxj4j1IUCzvbDNCBVvwZQ4K1fD5um9fW55N7odVcqySJl2-C3FWchYoxReZP7_7RVUt3oV4mRSfKCdUU-_mbjjE1bVpCrQlkSYdHm06lzLWb8BB8MIURPbozKbmeO"/>
</div>
<div>
<h3 class="font-title text-title text-on-surface mb-1">Dr. Sofia Martinez</h3>
<p class="font-body text-body text-text-secondary">Periodontist</p>
<p class="font-caption text-caption text-text-tertiary mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 0;">schedule</span>
                            Submitted 2h ago
                        </p>
</div>
</div>
<div class="flex gap-3">
<button class="flex-1 bg-surface border border-primary text-primary font-label text-label py-3 rounded-full hover:bg-surface-alt active:scale-95 transition-all">
                        Reject
                    </button>
<button class="flex-1 bg-primary text-on-primary font-label text-label py-3 rounded-full hover:bg-accent-pressed active:scale-95 transition-all shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
                        Approve
                    </button>
</div>
</article>
<!-- Card 2 -->
<article class="bg-surface rounded-2xl p-5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_24px_rgba(0,0,0,0.06)] transition-shadow">

<img alt="Document thumbnail" class="w-full h-full object-cover" data-alt="A macro shot of a sleek, modern medical license ID card featuring a subtle watermark, resting on a clean white surface with soft, diffused studio lighting. The aesthetic is extremely professional, crisp, and high-key, using soft warm earth tones and stark whites to convey trust and precision in a high-end healthcare networking context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNczYhsQhG7JMRf4JtluD8JbmeM69ivkOY7Wvm8GkfU_j3WdShiSKJSrC1rPak2hZZx7Ih7uzIq-QoHMaX4PpXP1N1Kn5pNYMpfiK5lj7ZRk05HdlBKlhHBg-H1xdV4_fHzJh6Dxs621YBZrKKbZm5V9hWzY1OnMejP94M74ba9qgMrELGGuJM2E0oY_EUgWn7lBNHAA0jn2dTOpGXMNU7EPWvBIP8ed_DmoWpnYwe7iLy_MEWjNUi"/>
</div>
<div>
<h3 class="font-title text-title text-on-surface mb-1">Dr. James Chen</h3>
<p class="font-body text-body text-text-secondary">Orthodontist</p>
<p class="font-caption text-caption text-text-tertiary mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 0;">schedule</span>
                            Submitted 4h ago
                        </p>
</div>
</div>
<div class="flex gap-3">
<button class="flex-1 bg-surface border border-primary text-primary font-label text-label py-3 rounded-full hover:bg-surface-alt active:scale-95 transition-all">
                        Reject

<button class="flex-1 bg-primary text-on-primary font-label text-label py-3 rounded-full hover:bg-accent-pressed active:scale-95 transition-all shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
                        Approve
                    </button>
</div>
</article>
</section>
