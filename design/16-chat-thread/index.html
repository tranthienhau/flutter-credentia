</div>
<span class="text-caption font-caption text-text-tertiary ml-2">10:42 AM</span>
</div>

<div class="flex flex-col items-end max-w-[85%] self-end gap-1">
<div class="bg-primary-container text-on-primary rounded-[20px] rounded-tr-sm px-4 py-3 shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
