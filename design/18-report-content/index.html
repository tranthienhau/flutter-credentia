<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "border": "#E8DAD0",
                        "tertiary": "#305651",
                        "surface-container": "#ffeae0",
                        "on-secondary-fixed": "#370e00",
                        "outline-variant": "#dac1ba",
                        "background": "#FBF5F1",
                        "on-tertiary-fixed": "#00201d",
                        "primary-fixed-dim": "#ffb59d",
                        "inverse-surface": "#3b2e27",
                        "on-tertiary-fixed-variant": "#274d48",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#793c21",
                        "tertiary-fixed-dim": "#a6cec8",
                        "primary-fixed": "#ffdbd0",
                        "surface-container-highest": "#f5ded4",
                        "surface-alt": "#F3E8E0",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#fff1eb",
                        "accent-pressed": "#82412C",
                        "on-tertiary-container": "#c6efe8",
                        "surface-tint": "#934930",
                        "inverse-primary": "#ffb59d",
                        "secondary-fixed": "#ffdbce",
                        "on-primary": "#ffffff",
                        "outline": "#87736d",
                        "text-tertiary": "#8C7A70",
                        "on-primary-container": "#ffe0d7",
                        "danger": "#DC2626",
                        "secondary": "#8f4c31",
                        "surface-dim": "#ecd6cc",
                        "primary-container": "#9e5238",
                        "on-surface-variant": "#54433e",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#ffb599",
                        "primary": "#803b23",
                        "tertiary-container": "#486e69",
                        "on-primary-fixed": "#390c00",
                        "secondary-container": "#ffa988",
                        "surface-container-high": "#fae4da",
                        "tertiary-fixed": "#c2ebe4",
                        "surface-variant": "#f5ded4",
                        "success": "#16A34A",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#72361c",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fff8f6",
                        "warning": "#D97706",
                        "on-background": "#251913",
                        "text-secondary": "#5C4A40",
                        "surface": "#FFFFFF",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#ffede6",
                        "on-surface": "#251913",
                        "accent-tint": "#F5E2D8",
                        "on-primary-fixed-variant": "#75331b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "edge-margin": "20px",
                        "gutter": "16px",
                        "unit": "8px",
                        "safe-bottom": "34px",
                        "safe-top": "59px"
                    },
                    "fontFamily": {
                        "display": ["Newsreader"],
                        "title": ["Nunito Sans"],
                        "body": ["Nunito Sans"],
                        "caption": ["Nunito Sans"],
                        "label": ["Nunito Sans"]
                    },
                    "fontSize": {
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "caption": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "label": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body antialiased min-h-screen flex flex-col items-center justify-end md:justify-center overflow-hidden">
<!-- Scrim (Background Dim) -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Bottom Sheet Modal -->
<div class="bg-surface w-full max-w-md rounded-t-[20px] md:rounded-[20px] z-50 shadow-2xl flex flex-col max-h-[795px] pb-safe-bottom translate-y-0 transition-transform duration-300">
<!-- Drag Handle (Mobile) -->
<div class="w-full flex justify-center pt-unit pb-gutter md:hidden">
<div class="w-12 h-1.5 bg-border rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-edge-margin h-[64px] border-b border-border w-full flex-shrink-0">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-alt transition-colors text-on-surface group">
<span class="material-symbols-outlined text-[24px] group-hover:scale-95 transition-transform" data-icon="close">close</span>
</button>
<h1 class="font-display text-title font-bold text-on-surface flex-1 text-center">Report Post</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
<!-- Content -->
<div class="p-edge-margin overflow-y-auto flex-1 flex flex-col gap-gutter">
<p class="font-body text-body text-text-secondary mb-unit">Please select a reason for reporting this post. Your report will be kept anonymous.</p>
<!-- Radio List -->
<div class="flex flex-col gap-unit">
<label class="flex items-center justify-between p-gutter rounded-xl hover:bg-surface-alt cursor-pointer transition-colors border border-transparent hover:border-border">
<span class="font-label text-body text-on-surface">Spam</span>
<input class="w-5 h-5 text-primary bg-surface border-outline focus:ring-primary focus:ring-2" name="report_reason" type="radio" value="spam"/>
</label>
<label class="flex items-center justify-between p-gutter rounded-xl hover:bg-surface-alt cursor-pointer transition-colors border border-transparent hover:border-border">
<span class="font-label text-body text-on-surface">Harassment</span>
<input class="w-5 h-5 text-primary bg-surface border-outline focus:ring-primary focus:ring-2" name="report_reason" type="radio" value="harassment"/>
</label>
<label class="flex items-center justify-between p-gutter rounded-xl hover:bg-surface-alt cursor-pointer transition-colors border border-transparent hover:border-border">
<span class="font-label text-body text-on-surface">Misinformation</span>
<input class="w-5 h-5 text-primary bg-surface border-outline focus:ring-primary focus:ring-2" name="report_reason" type="radio" value="misinformation"/>
</label>
<label class="flex items-center justify-between p-gutter rounded-xl hover:bg-surface-alt cursor-pointer transition-colors border border-transparent hover:border-border">
<span class="font-label text-body text-on-surface">Impersonation</span>
<input class="w-5 h-5 text-primary bg-surface border-outline focus:ring-primary focus:ring-2" name="report_reason" type="radio" value="impersonation"/>
</label>
<label class="flex items-center justify-between p-gutter rounded-xl hover:bg-surface-alt cursor-pointer transition-colors border border-transparent hover:border-border">
<span class="font-label text-body text-on-surface">Other</span>
<input class="w-5 h-5 text-primary bg-surface border-outline focus:ring-primary focus:ring-2" name="report_reason" type="radio" value="other"/>
</label>
</div>
<div class="h-[1px] bg-border w-full my-unit"></div>
<!-- Textarea -->
<div class="flex flex-col gap-unit mt-unit">
<label class="font-label text-label text-on-surface" for="details">Add details (optional)</label>
<textarea class="w-full rounded-xl border border-border bg-surface text-body font-body p-gutter placeholder:text-text-tertiary focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-none" id="details" placeholder="Tell us more about why you are reporting this post..." rows="3"></textarea>
</div>
</div>
<!-- Footer -->
<div class="p-edge-margin pt-gutter border-t border-border flex-shrink-0 bg-surface">
<button class="w-full bg-danger hover:bg-danger/90 text-on-error font-label text-label py-[14px] rounded-full transition-all active:scale-[0.98] flex items-center justify-center">
                Submit Report
            </button>
</div>
</div>
</body></html>
