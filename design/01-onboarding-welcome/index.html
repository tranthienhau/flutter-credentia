<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Fade in animation for elements */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 0.8s ease-out forwards;
        }
        @keyframes fadeUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>

<h1 class="font-display text-display text-primary tracking-tight">
                Credentia

</div>
<!-- Middle Section: Visual & Value Prop -->
<div class="flex-1 flex flex-col items-center justify-center -mt-8">
<!-- Illustration -->
<div class="w-full max-w-[280px] aspect-square relative mb-8 fade-up delay-200">

<img alt="" class="w-full h-full object-cover transform rotate-2 scale-[1.02]" src="https://lh3.googleusercontent.com/aida/AP1WRLtra6DnQ7wnGzABHX7wqbBwHVRwIbvMR6iYwfRgGsdEqs_LuU1Dla-3uSY0zHVsLRoqz-C6ZlXbOQlOdiUBlbGEGvCyG9ArXs2YOXw_31YIm1NaxGVHi1TIwVcVo4ZsaI7sktK6ijyfEyfo2_Hzvw1Xj7qjocT8SYtG1wnY7Iu6QkH74Te2VdWmlEWy7ZCg2fzYcjsru04LQ_v3J5cpVSPXyF2rIJ8qWpsvjyjtSZtHNisLcighn1Ebi_o"/>

<h2 class="font-title text-[28px] leading-[34px] text-primary">
                    The trusted network for healthcare professionals
                </h2>
<p class="font-body text-body text-text-secondary px-2">
                    Connect with verified peers, share clinical insights, and grow your career in a secure environment.
                </p>
</div>
</div>
<!-- Bottom Section: Actions -->
<div class="w-full space-y-4 mb-4 fade-up delay-300">
<button class="w-full bg-primary hover:bg-accent-pressed active:scale-[0.98] transition-all duration-200 text-on-primary font-label text-label py-[16px] rounded-full shadow-[0_4px_12px_rgba(128,59,35,0.2)]">
