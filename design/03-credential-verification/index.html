<body class="antialiased text-on-surface min-h-screen flex flex-col items-center">
<div class="w-full max-w-[600px] min-h-screen flex flex-col relative bg-background mx-auto shadow-[0_0_40px_rgba(0,0,0,0.02)] sm:shadow-none">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background w-full top-0 sticky z-50 flex items-center justify-between px-edge-margin h-[59px] pt-safe-top pb-4">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center -ml-2 text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-2xl">chevron_left</span>
</button>
<h1 class="font-title text-title dark:text-on-background absolute left-1/2 -translate-x-1/2 text-primary dark:text-primary-fixed-dim">Verification</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-edge-margin pt-6 pb-safe-bottom w-full max-w-[400px] mx-auto sm:max-w-full">
<!-- Step Indicator -->
<div class="flex flex-col items-center mb-8">
<span class="font-label text-label text-text-secondary uppercase tracking-wider mb-2">Step 2 of 3</span>
<div class="w-full h-1 bg-surface-alt rounded-full overflow-hidden flex gap-1">
<div class="h-full bg-primary-container rounded-full flex-1"></div>
<div class="h-full bg-primary-container rounded-full flex-1"></div>
<div class="h-full bg-surface-variant rounded-full flex-1"></div>
</div>
</div>
<!-- Heading -->
<div class="mb-10 text-center">
<h2 class="font-display text-display text-primary-container mb-2">Verify your credentials</h2>
<p class="font-body text-body text-text-secondary">We need this information to ensure the highest standard of care in our community.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 w-full">
<!-- License Number Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-label text-on-surface" for="license">License number</label>
<input class="w-full bg-surface border border-border rounded-xl px-4 py-3 font-body text-body text-on-surface placeholder:text-text-tertiary transition-shadow" id="license" placeholder="e.g. AB1234567" type="text"/>
</div>
<!-- State Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label text-label text-on-surface" for="state">State/Licensing board</label>
<div class="relative">
<select class="w-full bg-surface border border-border rounded-xl px-4 py-3 font-body text-body text-on-surface appearance-none pr-10 transition-shadow" id="state">
<option class="text-text-tertiary" disabled="" selected="" value="">Select state</option>
<option value="ca">California Dental Board</option>
<option value="ny">New York State Education Department</option>
<option value="tx">Texas State Board of Dental Examiners</option>
<option value="fl">Florida Board of Dentistry</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-text-tertiary pointer-events-none">expand_more</span>
</div>
</div>
<!-- NPI Number Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-label text-on-surface" for="npi">NPI number</label>
<input class="w-full bg-surface border border-border rounded-xl px-4 py-3 font-body text-body text-on-surface placeholder:text-text-tertiary transition-shadow" id="npi" placeholder="10-digit National Provider Identifier" type="text"/>
</div>
<!-- Document Upload Area -->
<div class="mt-4">
<label class="font-label text-label text-on-surface mb-2 block">License Document</label>
<button class="w-full border-2 border-dashed border-primary-container/40 rounded-[20px] bg-surface-bright hover:bg-surface-alt transition-colors p-8 flex flex-col items-center justify-center gap-3 active:scale-[0.99] group" type="button">
<div class="w-12 h-12 rounded-full bg-accent-tint flex items-center justify-center text-primary-container group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-2xl icon-fill">upload_file</span>
</div>
<span class="font-body text-body text-primary-container text-center max-w-[200px]">Upload your license photo or PDF</span>
</button>
<p class="font-caption text-caption text-text-tertiary text-center mt-3 flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                        Reviewed within 1-2 business days
                    </p>
</div>
<!-- Bottom Action Area -->
<div class="mt-8 mb-4">
<button class="w-full bg-primary-container text-on-primary rounded-full py-[14px] px-6 font-title text-title flex items-center justify-center hover:opacity-90 active:bg-accent-pressed transition-colors shadow-[0_4px_14px_rgba(158,82,56,0.25)]" type="submit">
                        Submit for Review
                    </button>
</div>
</form>
