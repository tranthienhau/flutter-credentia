<style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;

<body class="bg-background text-on-surface font-body antialiased min-h-screen flex flex-col pt-safe-top pb-safe-bottom mx-auto max-w-[600px] relative">
<!-- Top App Bar (Search Context) -->
<header class="fixed top-0 w-full z-50 bg-background max-w-[600px] mx-auto px-edge-margin pt-[59px] pb-unit flex flex-col gap-unit">
<div class="flex items-center gap-unit">
<!-- Search Input -->
<div class="flex-1 relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-tertiary" style="font-variation-settings: 'FILL' 0;">search</span>
<input class="w-full bg-surface-alt border border-border text-on-surface font-body text-body rounded-xl py-3 pl-10 pr-10 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-text-tertiary" placeholder="Search specialties, names..." type="text" value="Pediatric Neurosurgery"/>
<button aria-label="Clear search" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-tertiary hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">cancel</span>
</button>
</div>
<!-- Filter Button -->
<button class="bg-surface border border-border text-primary rounded-xl h-12 w-12 flex items-center justify-center shrink-0 shadow-card hover:bg-surface-alt transition-colors active:scale-95 relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">tune</span>
<!-- Active filter indicator -->
<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-primary ring-2 ring-surface"></span>
</button>
</div>
<!-- Filter Chips (Scrollable Row) -->
<div class="flex items-center gap-unit overflow-x-auto no-scrollbar py-1 w-full mask-linear-right">
<button class="shrink-0 px-4 py-2 bg-accent-tint text-primary-fixed-variant rounded-full font-label text-label flex items-center gap-1 active:scale-95 transition-transform whitespace-nowrap border border-primary/20">
<span>Rating: 4.5+</span>
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<button class="shrink-0 px-4 py-2 bg-accent-tint text-primary-fixed-variant rounded-full font-label text-label flex items-center gap-1 active:scale-95 transition-transform whitespace-nowrap border border-primary/20">
<span>Distance: &lt;5mi</span>
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<button class="shrink-0 px-4 py-2 bg-surface-alt text-text-secondary rounded-full font-label text-label flex items-center gap-1 active:scale-95 transition-transform whitespace-nowrap border border-transparent">
<span>Availability</span>
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_down</span>
</button>
<button class="shrink-0 px-4 py-2 bg-surface-alt text-text-secondary rounded-full font-label text-label flex items-center gap-1 active:scale-95 transition-transform whitespace-nowrap border border-transparent">
<span>Insurance</span>
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">keyboard_arrow_down</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center px-edge-margin mt-[140px] mb-[100px] text-center w-full">
<!-- Illustration -->
<div class="w-64 h-64 mb-8 relative flex items-center justify-center">
<!-- Decorative blurred background shape -->
<div class="absolute w-48 h-48 bg-accent-tint rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-pulse" style="animation-duration: 4s;"></div>
<img alt="Empty search results illustration" class="w-full h-full object-contain relative z-10 drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6sjCs_GEGRLzRMbOyb66AZaWwn2Vlk20GitrMlgGkRZVxahHF_oxgJa9msWlBIM4dx_wJ5LVrJF0RFLGL6wj6vj8SsZk6UTlDzluCP-lNvfwfqTNU3mNht3S2H_vZymZj5JCp6AQbQ1mj364A8507zkQpvHvIoevKwp0qauOFO4CKaAaKTJh9k1GTRWiyj3cGq73uJogRPE6MHLS_zJkXpK9D8Ffpevu-5i-yZjLlhTjsYV7r5E1M"/>
</div>
<!-- Typography -->
<div class="max-w-[300px] flex flex-col items-center gap-3">
<h1 class="font-display text-display-mobile text-on-surface">No professionals found</h1>
<p class="font-body text-body text-text-secondary">Try adjusting your filters or search a different specialty to find the right match.</p>
</div>
<!-- Call to Action -->
<div class="mt-8">
<button class="px-6 py-3.5 bg-transparent border border-primary text-primary font-label text-label rounded-full hover:bg-surface active:bg-surface-alt active:scale-95 transition-all duration-200">
                Clear all filters
            </button>
</div>
<!-- Helpful Suggestion (Optional contextual element) -->
<div class="mt-12 bg-surface w-full p-4 rounded-card shadow-card flex items-start gap-3 border border-border">
<div class="bg-surface-alt text-primary rounded-full p-2 shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lightbulb</span>
</div>
<div class="text-left">
<h3 class="font-title text-[16px] leading-snug font-semibold text-on-surface mb-1">Expand your search</h3>
<p class="font-body text-[14px] leading-snug text-text-secondary">Consider looking into general 'Pediatrics' or increasing your distance radius.</p>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-[84px] bg-surface shadow-[0_-1px_2px_rgba(0,0,0,0.04)] pb-safe-bottom max-w-[600px] left-1/2 -translate-x-1/2">
<button class="flex flex-col items-center justify-center text-text-tertiary hover:bg-surface-container-low transition-colors active:scale-90 duration-200 w-16 h-full rounded-xl">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label text-[11px] leading-none font-medium">Feed</span>
</button>
<button class="flex flex-col items-center justify-center text-primary font-semibold hover:bg-surface-container-low transition-colors active:scale-90 duration-200 w-16 h-full rounded-xl">
<span class="material-symbols-outlined mb-1 text-primary" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label text-[11px] leading-none text-primary">Discover</span>
</button>
<button class="flex flex-col items-center justify-center text-text-tertiary hover:bg-surface-container-low transition-colors active:scale-90 duration-200 w-16 h-full rounded-xl relative">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">chat</span>
<span class="font-label text-[11px] leading-none font-medium">Messages</span>
</button>
<button class="flex flex-col items-center justify-center text-text-tertiary hover:bg-surface-container-low transition-colors active:scale-90 duration-200 w-16 h-full rounded-xl relative">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">notifications</span>

<span class="absolute top-3 right-4 w-2 h-2 bg-error rounded-full ring-2 ring-surface"></span>
<span class="font-label text-[11px] leading-none font-medium">Notifications</span>
</button>
<button class="flex flex-col items-center justify-center text-text-tertiary hover:bg-surface-container-low transition-colors active:scale-90 duration-200 w-16 h-full rounded-xl">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label text-[11px] leading-none font-medium">Profile</span>
</button>
</nav>
<style>
