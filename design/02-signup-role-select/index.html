<body class="bg-background text-on-background font-body min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Area (Transactional/Linear Intent: No BottomNavBar, Simple TopNav) -->
<header class="w-full flex justify-between items-center px-edge-margin pt-safe-top h-[84px] bg-background">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-alt transition-colors active:scale-95 text-text-secondary" type="button">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<div class="font-label text-label text-text-tertiary">
            Step 1 of 3
        </div>
<div class="w-10"></div> <!-- Spacer for flex balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-edge-margin pb-safe-bottom w-full max-w-[600px] mx-auto">
<!-- Headers -->
<section class="mt-4 mb-8">
<h1 class="font-display text-display-mobile md:text-display text-primary mb-2">What's your role?</h1>
<p class="font-body text-body text-text-secondary">Select your primary specialty to get started.</p>
</section>
<!-- Role Grid -->
<section class="mb-10">
<div class="grid grid-cols-2 gap-3">
<!-- Role Card 1 (Selected State) -->
<button class="role-card flex flex-col items-center justify-center p-4 bg-accent-tint border-2 border-primary-container rounded-2xl shadow-soft-1 active:scale-95 transition-all text-center h-[110px]" data-selected="true" type="button">
<span class="material-symbols-outlined fill text-primary-container mb-2" style="font-size: 32px;">medical_services</span>
<span class="font-label text-label text-primary-fixed">Dentist</span>
</button>
<!-- Role Card 2 -->
<button class="role-card flex flex-col items-center justify-center p-4 bg-surface border border-transparent rounded-2xl shadow-soft-1 hover:shadow-soft-2 active:scale-95 transition-all text-center h-[110px]" data-selected="false" type="button">
<span class="material-symbols-outlined text-text-tertiary mb-2" style="font-size: 32px;">health_and_safety</span>
<span class="font-label text-label text-text-secondary">Dental Hygienist</span>
</button>
<!-- Role Card 3 -->
<button class="role-card flex flex-col items-center justify-center p-4 bg-surface border border-transparent rounded-2xl shadow-soft-1 hover:shadow-soft-2 active:scale-95 transition-all text-center h-[110px]" data-selected="false" type="button">
<span class="material-symbols-outlined text-text-tertiary mb-2" style="font-size: 32px;">support_agent</span>
<span class="font-label text-label text-text-secondary">Dental Assistant</span>
</button>
<!-- Role Card 4 -->
<button class="role-card flex flex-col items-center justify-center p-4 bg-surface border border-transparent rounded-2xl shadow-soft-1 hover:shadow-soft-2 active:scale-95 transition-all text-center h-[110px]" data-selected="false" type="button">
<span class="material-symbols-outlined text-text-tertiary mb-2" style="font-size: 32px;">dentistry</span>
<span class="font-label text-label text-text-secondary">Orthodontist</span>
</button>
<!-- Role Card 5 (More) -->
<button class="role-card flex flex-col items-center justify-center p-4 bg-surface border border-transparent border-dashed rounded-2xl shadow-soft-1 hover:shadow-soft-2 active:scale-95 transition-all text-center h-[110px]" data-selected="false" type="button">
<span class="material-symbols-outlined text-text-tertiary mb-2" style="font-size: 32px;">add_circle</span>
<span class="font-label text-label text-text-secondary">More specialties</span>
</button>
</div>
</section>
<!-- Account Details Form -->
<section class="flex-1 flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-secondary pl-1" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-tertiary">mail</span>
<input class="w-full bg-surface border border-border rounded-[12px] py-3.5 pl-12 pr-4 font-body text-body text-on-surface placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow shadow-soft-1" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-label text-text-secondary pl-1" for="password">Create a password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-tertiary">lock</span>
<input class="w-full bg-surface border border-border rounded-[12px] py-3.5 pl-12 pr-12 font-body text-body text-on-surface placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow shadow-soft-1" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-text-tertiary hover:text-text-secondary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="font-caption text-caption text-text-tertiary pl-1 mt-1">Must be at least 8 characters.</p>
</div>
</section>
<!-- Fixed Action Area -->
<div class="mt-8 pt-4 pb-4">
<button class="w-full bg-primary-container hover:bg-accent-pressed text-on-primary font-title text-title py-[14px] rounded-full shadow-soft-2 active:scale-95 transition-all duration-200" type="button">
                Continue
            </button>
</div>
</main>
<script>
        // Simple micro-interaction for role cards selection
        document.addEventListener('DOMContentLoaded', () => {
            const roleCards = document.querySelectorAll('.role-card');
            
            roleCards.forEach(card => {
                card.addEventListener('click', function() {
                    // Reset all cards to unselected state
                    roleCards.forEach(c => {
                        c.setAttribute('data-selected', 'false');
                        c.className = 'role-card flex flex-col items-center justify-center p-4 bg-surface border border-transparent rounded-2xl shadow-soft-1 hover:shadow-soft-2 active:scale-95 transition-all text-center h-[110px]';
                        
                        // Handle the dashed border case for the last card
                        if(c.querySelector('.material-symbols-outlined').textContent === 'add_circle') {
                             c.classList.add('border-dashed');
                        }
                        
                        const icon = c.querySelector('.material-symbols-outlined');
                        const text = c.querySelector('span:not(.material-symbols-outlined)');
                        
                        icon.classList.remove('fill', 'text-primary-container');
                        icon.classList.add('text-text-tertiary');
                        
                        text.classList.remove('text-primary-fixed');
                        text.classList.add('text-text-secondary');
                    });
                    
                    // Set clicked card to selected state
                    this.setAttribute('data-selected', 'true');
                    this.className = 'role-card flex flex-col items-center justify-center p-4 bg-accent-tint border-2 border-primary-container rounded-2xl shadow-soft-1 active:scale-95 transition-all text-center h-[110px]';
                    
                    const icon = this.querySelector('.material-symbols-outlined');
                    const text = this.querySelector('span:not(.material-symbols-outlined)');
                    
                    icon.classList.remove('text-text-tertiary');
                    icon.classList.add('fill', 'text-primary-container');
                    
                    text.classList.remove('text-text-secondary');
                    text.classList.add('text-primary-fixed');
                });
            });
        });
    </script>
