<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 50% 50%, rgba(158, 82, 56, 0.03) 0%, transparent 50%);
            background-size: 100vw 100vw;
            background-position: center top;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col relative overflow-x-hidden antialiased bg-pattern">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-edge-margin pt-safe-top h-[calc(56px+59px)] z-40 transition-shadow duration-300" id="top-app-bar">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">hub</span>
<span class="font-display text-display-mobile text-primary font-bold tracking-tight">Credentia</span>
</div>
<div class="flex items-center">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center px-edge-margin pb-[calc(84px+34px+32px)] pt-4 z-10 w-full max-w-lg mx-auto">
<div class="w-full max-w-[280px] aspect-square mb-10 relative flex items-center justify-center">
<div class="absolute inset-0 bg-surface-alt rounded-full opacity-50 blur-3xl scale-110"></div>
<img alt="" class="w-full h-full object-contain relative z-10 drop-shadow-sm mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALdMxhJ0I_VB4Wdtnk2F9mpCvJqghLlLPD7Po7AxhqIu5Sv4qqu5yCrk09aIZ7AvvNJrEZ0XeY_kksDpgJ7HWwIVfyN3aDGRYauNcrfek4wef5cVlEqJWuAFyL0LJjsGwPDKzhrss7KqcvhvEc6W-sreBezS3vmX7WvKzYDgVufoLulncAvCwBAplwhxDVu4cxOzpnvPlAS9Ke4Jm82qf2FYegtpOoh6LszjgFG6DZao0uGqSF_h72"/>
</div>
<div class="text-center flex flex-col items-center max-w-[320px]">
<h1 class="font-display text-display text-on-surface mb-3">Your feed is quiet</h1>
<p class="font-body text-body text-text-secondary mb-10">Connect with peers or share your first update to see posts here</p>
<button class="bg-primary hover:bg-accent-pressed active:scale-95 transition-all duration-200 text-on-primary font-label text-label px-8 py-[14px] rounded-full inline-flex items-center justify-center shadow-[0_4px_12px_rgba(128,59,35,0.15)] min-w-[220px]">
                Find Professionals
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-surface px-4 pb-safe-bottom h-[calc(50px+34px)] shadow-[0_-1px_2px_rgba(0,0,0,0.04)] z-50 md:hidden rounded-t-none">
<!-- Feed (Active) -->
<button class="text-primary font-bold flex flex-col items-center justify-center gap-1 hover:bg-surface-alt transition-colors px-3 py-2 rounded-xl active:scale-90 duration-150 flex-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-[11px] leading-tight">Feed</span>
</button>
<!-- Discover -->
<button class="text-text-tertiary flex flex-col items-center justify-center gap-1 hover:bg-surface-alt transition-colors px-3 py-2 rounded-xl active:scale-90 duration-150 flex-1">
<span class="material-symbols-outlined">search</span>
<span class="font-label text-[11px] leading-tight font-medium">Discover</span>
</button>
<!-- Messages -->
<button class="text-text-tertiary flex flex-col items-center justify-center gap-1 hover:bg-surface-alt transition-colors px-3 py-2 rounded-xl active:scale-90 duration-150 flex-1">
<span class="material-symbols-outlined">chat</span>
<span class="font-label text-[11px] leading-tight font-medium">Messages</span>
</button>
<!-- Notifications -->
<button class="text-text-tertiary flex flex-col items-center justify-center gap-1 hover:bg-surface-alt transition-colors px-3 py-2 rounded-xl active:scale-90 duration-150 flex-1">
<div class="relative">
<span class="material-symbols-outlined">notifications</span>
</div>
<span class="font-label text-[11px] leading-tight font-medium">Notifications</span>
</button>
<!-- Profile -->
<button class="text-text-tertiary flex flex-col items-center justify-center gap-1 hover:bg-surface-alt transition-colors px-3 py-2 rounded-xl active:scale-90 duration-150 flex-1">
<span class="material-symbols-outlined">person</span>
<span class="font-label text-[11px] leading-tight font-medium">Profile</span>
</button>
</nav>
<script>
        // Subtle scroll effect for Top App Bar
        const topAppBar = document.getElementById('top-app-bar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                topAppBar.classList.add('shadow-[0_1px_2px_rgba(0,0,0,0.04)]', 'bg-surface/95', 'backdrop-blur-sm');
                topAppBar.classList.remove('bg-background');
            } else {
                topAppBar.classList.remove('shadow-[0_1px_2px_rgba(0,0,0,0.04)]', 'bg-surface/95', 'backdrop-blur-sm');
                topAppBar.classList.add('bg-background');
            }
        });
    </script>
</body></html>
